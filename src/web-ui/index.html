<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/openbitfun-app-icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/openbitfun-app-icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/openbitfun-app-icon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenBitFun - AI Code Assistant</title>
    <script>
      (function () {
        var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        var root = document.documentElement;
        var fallbackMessages = {
          'en-US': {
            loadingApp: 'Starting OpenBitFun...',
            minimize: 'Minimize',
            maximize: 'Maximize',
            restore: 'Restore',
            close: 'Close',
            petLoading: 'Loading companion...'
          },
          'zh-CN': {
            loadingApp: '正在启动 OpenBitFun...',
            minimize: '最小化',
            maximize: '最大化',
            restore: '还原',
            close: '关闭',
            petLoading: '正在加载助手...'
          },
          'zh-TW': {
            loadingApp: '正在啟動 OpenBitFun...',
            minimize: '最小化',
            maximize: '最大化',
            restore: '還原',
            close: '關閉',
            petLoading: '正在載入助手...'
          }
        };
        function resolveLocale() {
          var injected = window.__OPENBITFUN_BOOTSTRAP_LOCALE__;
          var lang = typeof injected === 'string' && injected ? injected : navigator.language;
          if (/^zh-(tw|hk|mo|hant)/i.test(lang)) return 'zh-TW';
          if (/^en/i.test(lang)) return 'en-US';
          return 'zh-CN';
        }
        function resolveMessages() {
          var locale = resolveLocale();
          var injected = window.__OPENBITFUN_BOOTSTRAP_MESSAGES__;
          return Object.assign({}, fallbackMessages[locale], injected || {});
        }
        window.__OPENBITFUN_RESOLVE_BOOTSTRAP_MESSAGES__ = resolveMessages;
        window.__OPENBITFUN_RESOLVE_BOOTSTRAP_LOCALE__ = resolveLocale;
        window.__OPENBITFUN_STARTUP_OVERLAY_STARTED_AT__ = performance.now();
        root.setAttribute('lang', resolveLocale());
        root.setAttribute('data-openbitfun-design-system-root', '');
        if (!root.hasAttribute('data-color-scheme')) {
          root.setAttribute('data-color-scheme', m && m.matches ? 'dark' : 'light');
        }
        root.setAttribute('data-contrast', 'standard');
        root.setAttribute('data-density', 'compact');
        var bg = root.style.backgroundColor || 'var(--openbitfun-color-surface-chrome)';
        root.style.backgroundColor = bg;
        function paintBody() {
          if (document.body) document.body.style.backgroundColor = bg;
        }
        paintBody();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', paintBody);
        } else {
          paintBody();
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/design-system-theme.css" />
    <!-- Keep the pre-React controls on the same visual contract as the app chrome. -->
    <link rel="stylesheet" href="/src/app/components/WindowControls/WindowControls.scss" />
    <!-- OPENBITFUN_FONT_PROFILE_STYLESHEET -->
    <style>
      @layer openbitfun.tokens.system, openbitfun.tokens.theme, openbitfun.reset, openbitfun.base, openbitfun.components, openbitfun.overrides;

      @layer openbitfun.reset {
        *,
        *::before,
        *::after {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      html {
        background-color: var(--openbitfun-color-surface-chrome);
      }
      
      body {
        background-color: inherit;
      }

      #root,
      #openbitfun-startup-overlay {
        width: 100%;
        height: 100%;
      }

      #openbitfun-startup-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
      }

      .openbitfun-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .splash-screen {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--openbitfun-color-surface-chrome);
        color: var(--openbitfun-color-content-muted);
        font-family: var(--openbitfun-font-family-sans);
        font-size: 13px;
        pointer-events: none;
      }

      #openbitfun-startup-overlay.openbitfun-startup-overlay--exiting {
        animation: openbitfun-startup-overlay-exit 0.24s ease-in-out both;
      }

      .window-controls.openbitfun-startup-window-controls {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 2;
        height: var(--openbitfun-layout-toolbar-md-height);
        pointer-events: auto;
      }

      .openbitfun-startup-window-controls[hidden] {
        display: none;
      }

      .splash-screen__center {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-screen__logo-wrap {
        animation: splash-logo-idle 3.2s ease-in-out infinite;
        -webkit-animation: splash-logo-idle 3.2s ease-in-out infinite;
        will-change: filter, opacity, transform;
      }

      .splash-screen__logo,
      .openbitfun-preload__logo {
        display: block;
        width: 96px;
        height: 96px;
        user-select: none;
        -webkit-user-select: none;
      }

      .openbitfun-preload__logo--light {
        display: none;
      }

      [data-color-scheme="dark"] .openbitfun-preload__logo--dark {
        display: none;
      }

      [data-color-scheme="dark"] .openbitfun-preload__logo--light {
        display: block;
      }

      .splash-screen__message {
        position: absolute;
        top: calc(100% + 16px);
        left: 50%;
        min-width: 220px;
        max-width: min(360px, calc(100vw - 48px));
        color: var(--openbitfun-color-content-muted);
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
        opacity: 0;
        transform: translate(-50%, -2px);
        transition: opacity 0.2s ease-out, transform 0.2s ease-out;
        pointer-events: none;
      }

      .splash-screen__message--visible {
        opacity: 0.62;
        transform: translate(-50%, 0);
      }

      @keyframes splash-logo-idle {
        0%, 100% {
          opacity: 0.42;
          transform: scale(0.985);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes openbitfun-startup-overlay-exit {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-screen__logo-wrap {
          animation: none;
        }

        .splash-screen__logo {
          filter: none;
        }

        .splash-screen__message {
          transition: none;
        }
      }

      .openbitfun-pet-preload-body {
        background: transparent !important;
      }

      .openbitfun-pet-preload-body #root {
        background: transparent;
      }

      .openbitfun-pet-preload {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        background: transparent;
        pointer-events: none;
      }

      .openbitfun-pet-preload__sprite {
        position: relative;
        width: 48px;
        height: 48px;
        transform-origin: center bottom;
        animation: openbitfun-pet-preload-breathe 1.8s ease-in-out infinite;
      }

      @keyframes openbitfun-pet-preload-breathe {
        0%, 100% {
          opacity: 0.58;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.92;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .openbitfun-pet-preload__sprite {
          animation: none;
        }
      }
    </style>
    <!-- Creative overrides are activated by the runtime after the shell renders. -->
  </head>

  <body>
    <script type="module" src="/src/main.tsx"></script>
    <div id="root"></div>
    <div id="openbitfun-startup-overlay">
      <div class="splash-screen">
        <div
          class="window-controls openbitfun-startup-window-controls"
          data-openbitfun-component="window-controls"
          data-openbitfun-part="root"
          data-startup-window-controls
          hidden
        >
          <button class="window-controls__btn window-controls__btn--minimize" type="button" data-startup-window-action="minimize">
            <svg data-startup-window-control-platform="windows" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M1 6.5h10" stroke="currentColor" stroke-width="1" />
            </svg>
            <svg data-startup-window-control-platform="generic" width="10" height="10" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <line x1="3" y1="7" x2="11" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
          <button class="window-controls__btn window-controls__btn--maximize" type="button" data-startup-window-action="toggle_maximize">
            <svg data-startup-window-control-platform="windows" data-startup-window-control-state="normal" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M1.5 1.5h9v9h-9z" stroke="currentColor" stroke-width="1" />
            </svg>
            <svg data-startup-window-control-platform="windows" data-startup-window-control-state="maximized" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" style="display: none">
              <path d="M3.5 3.5v-2h7v7h-2 M1.5 3.5h7v7h-7z" stroke="currentColor" stroke-width="1" />
            </svg>
            <svg data-startup-window-control-platform="generic" data-startup-window-control-state="normal" width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="8" height="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <svg data-startup-window-control-platform="generic" data-startup-window-control-state="maximized" width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true" style="display: none">
              <path d="M4 4V1.5Q4 1 4.5 1h6q.5 0 .5.5v6q0 .5-.5.5H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              <rect x="1" y="4" width="7" height="7" rx="0.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button class="window-controls__btn window-controls__btn--close" type="button" data-startup-window-action="close">
            <svg data-startup-window-control-platform="windows" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="m1.5 1.5 9 9 m0-9-9 9" stroke="currentColor" stroke-width="1" />
            </svg>
            <svg data-startup-window-control-platform="generic" width="10" height="10" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <line x1="3" y1="3" x2="11" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              <line x1="11" y1="3" x2="3" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="splash-screen__center">
          <div class="splash-screen__logo-wrap">
            <img
              src="/brand/openbitfun-mark-dark-128.png"
              class="openbitfun-preload__logo openbitfun-preload__logo--dark"
              alt=""
              draggable="false"
              decoding="async"
              fetchpriority="low"
            />
            <img
              class="openbitfun-preload__logo openbitfun-preload__logo--light"
              src="/brand/openbitfun-mark-light-128.png"
              alt=""
              draggable="false"
              decoding="async"
              fetchpriority="low"
            />
          </div>
          <div class="splash-screen__message">Starting OpenBitFun...</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var isPetWindow = params.get('openbitfunWindow') === 'agent-companion';
        var messages = window.__OPENBITFUN_RESOLVE_BOOTSTRAP_MESSAGES__
          ? window.__OPENBITFUN_RESOLVE_BOOTSTRAP_MESSAGES__()
          : { loadingApp: 'Starting OpenBitFun...', minimize: 'Minimize', maximize: 'Maximize', restore: 'Restore', close: 'Close', petLoading: 'Loading companion...' };
        var locale = window.__OPENBITFUN_RESOLVE_BOOTSTRAP_LOCALE__
          ? window.__OPENBITFUN_RESOLVE_BOOTSTRAP_LOCALE__()
          : 'en-US';
        document.documentElement.setAttribute('lang', locale);

        if (isPetWindow) {
          document.body.classList.add('openbitfun-pet-preload-body');
          var startupOverlay = document.getElementById('openbitfun-startup-overlay');
          if (startupOverlay) startupOverlay.remove();
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div class="openbitfun-pet-preload"><div class="openbitfun-pet-preload__sprite" aria-hidden="true"></div><span class="openbitfun-sr-only"></span></div>';
            var petStatus = root.querySelector('.openbitfun-sr-only');
            if (petStatus) petStatus.textContent = messages.petLoading;
          }
          return;
        }

        var hint = document.querySelector('.splash-screen__message');
        if (hint) {
          hint.textContent = messages.loadingApp;
          window.setTimeout(function () {
            hint.classList.add('splash-screen__message--visible');
          }, 1200);
        }

        var controls = document.querySelector('[data-startup-window-controls]');
        if (controls && window.__OPENBITFUN_SHOW_STARTUP_WINDOW_CONTROLS__) {
          var isWindows = (
            (typeof navigator.userAgent === 'string' && navigator.userAgent.toUpperCase().includes('WINDOWS'))
            || (typeof navigator.platform === 'string' && navigator.platform.toUpperCase().includes('WIN'))
          );
          controls.classList.toggle('window-controls--windows', isWindows);
          controls.querySelectorAll('[data-startup-window-control-platform]').forEach(function (glyph) {
            if (glyph.getAttribute('data-startup-window-control-platform') !== (isWindows ? 'windows' : 'generic')) {
              glyph.remove();
            } else {
              glyph.removeAttribute('data-startup-window-control-platform');
            }
          });
          controls.hidden = false;
          var tauri = window.__TAURI_INTERNALS__;
          var stateRequestVersion = 0;
          var labels = {
            minimize: messages.minimize,
            toggle_maximize: messages.maximize,
            close: messages.close
          };
          var maximizeButton = controls.querySelector('[data-startup-window-action="toggle_maximize"]');
          function setButtonLabel(button, label) {
            if (!button) return;
            button.setAttribute('aria-label', label);
            button.setAttribute('title', label);
          }
          function applyWindowState(response) {
            if (!response || typeof response.isMaximized !== 'boolean') return;
            var isMaximized = response.isMaximized;
            if (isMaximized) {
              controls.setAttribute('data-openbitfun-state', 'maximized');
            } else {
              controls.removeAttribute('data-openbitfun-state');
            }
            setButtonLabel(maximizeButton, isMaximized ? messages.restore : messages.maximize);
            if (maximizeButton) {
              maximizeButton.querySelectorAll('[data-startup-window-control-state]').forEach(function (glyph) {
                glyph.style.display = glyph.getAttribute('data-startup-window-control-state') === (isMaximized ? 'maximized' : 'normal') ? '' : 'none';
              });
            }
          }
          function invokeWindowControl(action) {
            if (!tauri || typeof tauri.invoke !== 'function') return;
            var requestVersion = ++stateRequestVersion;
            tauri.invoke('startup_window_control', { request: { action: action } })
              .then(function (response) {
                if (requestVersion === stateRequestVersion) applyWindowState(response);
              })
              .catch(function () {});
          }
          controls.querySelectorAll('[data-startup-window-action]').forEach(function (button) {
            var action = button.getAttribute('data-startup-window-action');
            var label = labels[action] || action;
            setButtonLabel(button, label);
            button.addEventListener('click', function (event) {
              event.preventDefault();
              event.stopPropagation();
              invokeWindowControl(action);
            });
          });
          invokeWindowControl('get_state');
          window.setTimeout(function () {
            if (controls.isConnected) invokeWindowControl('get_state');
          }, 120);
        }
      })();
    </script>
  </body>
</html>
