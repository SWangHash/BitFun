[package]
name = "openbitfun-matrix-adapter"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "OpenHarmony Matrix skill market adapter for BitFun (protocol translation + skill ZIP install)"

[lib]
path = "src/lib.rs"

[dependencies]
# HTTP client (json + native-tls + stream are the only features this crate
# relies on; workspace = true inherits the broader workspace version pin, and
# per repo policy this crate declares only the slices it actually uses since
# the workspace disables reqwest defaults).
reqwest = { workspace = true, features = ["json", "native-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread"] }
log = { workspace = true }
thiserror = { workspace = true }
# URL path encoding for Matrix skill enName values that may contain special
# characters (e.g. "KMP CMP" with a space) 鈥?see spec.md Edge Cases.
urlencoding = { workspace = true }
# Async stream iteration for bounded response body collection.
futures = { workspace = true }

[lints]
workspace = true
